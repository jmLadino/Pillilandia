<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Pillilandia · Sincronizado</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('https://jmladino.github.io/Pillilandia/Menu/Imagenes/fondoweb.jpg?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      color: #333;
      backdrop-filter: blur(5px);
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9);
      max-width: 700px;
      margin: 50px auto;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo {
      display: block;
      margin: 0 auto 20px auto;
      max-width: 50%;
    }

    details {
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      background-color: #f9f9f9;
    }

    summary {
      font-weight: bold;
      font-size: 1.2em;
      cursor: pointer;
    }

    ul {
      list-style-type: none;
      padding-left: 15px;
    }

    li {
      margin: 10px 0;
      border-bottom: 1px dashed #ccc;
      padding-bottom: 10px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      font-size: 1em;
      font-weight: bold;
    }

    .item-description {
      font-size: 0.85em;
      color: #555;
      margin-top: 4px;
    }

    .price {
      font-weight: bold;
    }

    .category-img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .social {
      text-align: center;
      margin-top: 30px;
    }

    .social a {
      margin: 0 10px;
      text-decoration: none;
      display: inline-block;
    }

    .social img {
      width: 40px;
      height: 40px;
    }

    .menu-status { text-align:center; padding:22px; color:#555; }
    .menu-error { background:#fff1f0; color:#8b1a12; border:1px solid #e4a5a0; border-radius:10px; }
    .category-empty { color:#777; font-style:italic; }
  </style>
</head>

<body>
  <div class="container">
    <img class="logo"
      src="https://jmladino.github.io/Pillilandia/Menu/Imagenes/logosinfondo.png?auto=format&fit=crop&w=800&q=80"
      alt="Logo Heladería">


    <div id="menuStatus" class="menu-status">Cargando menú actualizado…</div>
    <div id="dynamicMenu"></div>

    <div class="social">
      <h2>Síguenos en nuestras redes</h2>
      <a href="https://www.facebook.com/heladeriapillilandia2" target="_blank"><img
          src="https://jmladino.github.io/Pillilandia/Menu/Imagenes/rrssfb.png" alt="Facebook"></a>
      <a href="https://www.instagram.com/heladeriapillilandia" target="_blank"><img
          src="https://jmladino.github.io/Pillilandia/Menu/Imagenes/rrssig.png" alt="Instagram"></a>
    </div>

    <p id="lastUpdate" style="text-align: right; font-size: 0.85em; color: #666; margin-top: 20px;"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB7tJDP1ZtUwrERX1IN8Ab9brtSeWjUdFU",
      authDomain: "pillilandia-pos.firebaseapp.com",
      projectId: "pillilandia-pos",
      storageBucket: "pillilandia-pos.firebasestorage.app",
      messagingSenderId: "940089589607",
      appId: "1:940089589607:web:883b3aea41e1251b13b9c2"
    };

    const categoryOrder = ['Helados & Repostería','Bebidas Calientes','Desayunos & Sandwiches','Bebidas Frías y Jugos'];
    const categoryImages = {
      'Bebidas Calientes':'https://jmladino.github.io/Pillilandia/Menu/Imagenes/cafemenu.jpg',
      'Bebidas Frías y Jugos':'https://jmladino.github.io/Pillilandia/Menu/Imagenes/jugosmenu.jpg',
      'Desayunos & Sandwiches':'https://jmladino.github.io/Pillilandia/Menu/Imagenes/desayunomenu.jpg',
      'Helados & Repostería':'https://jmladino.github.io/Pillilandia/Menu/Imagenes/heladosmenu.jpg'
    };
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const fmt = value => new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(value||0));

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const menuStatus = document.getElementById('menuStatus');
    const dynamicMenu = document.getElementById('dynamicMenu');
    const lastUpdate = document.getElementById('lastUpdate');

    function renderMenu(products){
      const active = products.filter(p => p.active !== false);
      const availableCategories = [...new Set(active.map(p => p.category).filter(Boolean))];
      const categories = [...categoryOrder.filter(c => availableCategories.includes(c)), ...availableCategories.filter(c => !categoryOrder.includes(c)).sort((a,b)=>a.localeCompare(b,'es'))];
      if(!active.length){
        menuStatus.className='menu-status';
        menuStatus.textContent='No hay productos disponibles en este momento.';
        dynamicMenu.innerHTML='';
        return;
      }
      menuStatus.style.display='none';
      dynamicMenu.innerHTML=categories.map(category=>{
        const items=active.filter(p=>p.category===category).sort((a,b)=>(Number(a.displayOrder)||9999)-(Number(b.displayOrder)||9999)||String(a.name).localeCompare(String(b.name),'es'));
        if(!items.length)return '';
        const image=categoryImages[category];
        return `<details open><summary>${esc(category)}</summary>${image?`<img class="category-img" src="${esc(image)}" alt="${esc(category)}">`:''}<ul>${items.map(p=>`<li><div class="item-header"><span>${esc(p.name)}</span><span class="price">${fmt(p.price)}</span></div>${String(p.description||'').trim()?`<div class="item-description">${esc(p.description)}</div>`:''}</li>`).join('')}</ul></details>`;
      }).join('');
      const latest=active.map(p=>new Date(p.updatedAt||p.createdAt||0)).filter(d=>!Number.isNaN(d.getTime())).sort((a,b)=>b-a)[0];
      lastUpdate.textContent=latest?`Menú actualizado: ${latest.toLocaleDateString('es-CL')}`:'Menú sincronizado con Pillilandia';
    }

    onSnapshot(collection(db,'products'),snapshot=>{
      renderMenu(snapshot.docs.map(doc=>({id:doc.id,...doc.data()})));
    },error=>{
      console.error(error);
      menuStatus.className='menu-status menu-error';
      menuStatus.innerHTML='<b>No fue posible cargar el menú.</b><br>Revisa la conexión o los permisos públicos de lectura de la colección products.';
      dynamicMenu.innerHTML='';
    });
  </script>
</body>

</html>
